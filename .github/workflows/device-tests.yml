# Public test copy (coordinator-tests): runs on every push to any branch, free because the repo is public.
# Filled by scripts/publish-tests in the private repo; edit the copy in ci/public/workflows there, not here.
name: device-tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: ${{ github.workspace }}/../android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/../android-sdk
      GH_TOKEN: ${{ github.token }}
      # The commit under test: the PR's head commit on a pull request, else the pushed commit (design 4.19.4).
      SMJ_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SMJ_SHA }}
      # actions/setup-java v6.3.0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android SDK
        run: bash ci/install-android-sdk.sh
      - name: Instrumented tests on api34
        run: |
          # Seed: first 16 hex digits of the commit sha as a signed 64-bit number (design 4.5).
          SEED=2192129022363955787  # fixed: the seed S1.15 failed with
          echo "device-seed=$SEED"
          ./gradlew :app:api34DebugAndroidTest --console=plain \
            -Pandroid.testInstrumentationRunnerArguments.smjSeed="$SEED" \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Report result as check run smj-device
        if: always()
        run: |
          # Design 4.19.4 step 5: `tools device-report` reads the device JUnit reports and prints
          # the summary text (4.5); its first line is the check run's title.
          ./gradlew -q :tools:installDist
          tools/build/install/tools/bin/tools device-report > "$RUNNER_TEMP/device-summary.txt"
          TITLE=$(head -n 1 "$RUNNER_TEMP/device-summary.txt")
          case "$TITLE" in
            "DEVICE PASS"*) CONCL=success ;;
            *) CONCL=failure ;;
          esac
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" -X POST \
            -f name=smj-device -f head_sha="${SMJ_SHA}" \
            -f status=completed -f conclusion="$CONCL" \
            -f "output[title]=$TITLE" -f "output[summary]=$(cat "$RUNNER_TEMP/device-summary.txt")"
