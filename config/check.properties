# Where the check's device phase gets its results (designs/stage-1-foundation.md 4.1, 4.5).
# gmd     = a managed emulator started by the check
# actions = the device-tests workflow's result for the pushed commit (4.19.4)
# S1.3 result (P1): this cloud VM has no /dev/kvm, so the emulator cannot run here.
device=actions
# The public test copy (TESTING.md): this private repo has no free Actions minutes, so in actions mode the check reads the
# smj-device check run of the snapshot of HEAD in this repo (the snapshot commit's message has a line `Source: <HEAD sha>`).
# Delete this line to read the private repo's own check run for HEAD instead.
device-repo=ryangraham-1999/coordinator-tests
